<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>PATOLA SQUAD — Profil Komunitas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<svg class="bg-line" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path d="M 780 -50 C 500 150, 900 350, 620 550 S 150 850, 420 1050 S 750 1300, 500 1450" />
  <circle cx="620" cy="550" r="4"/>
  <circle cx="420" cy="1050" r="4"/>
</svg>

<main>
  <section class="hero">
    <img class="logo" src="image/logo.png" alt="Logo Patola Squad" />

    <p class="eyebrow">Profil Komunitas</p>
    <h1>PATOLA <em>SQUAD</em></h1>
    <p class="lede">Komunitas kreatif dan solid.</p>
  </section>

  <section class="section-head">
    <h2>ROSTER ADMIN</h2>
  </section>

  <div class="grid">
    <!-- Card 1 -->
    <div class="card">
      <div class="scale-strip"></div>
      <div class="card-top">
        <div class="photo-wrap">
          <img class="photo" src="image/admin1.jpg" alt="Admin 1" />
          <span class="num-chip">01</span>
        </div>
        <div class="who">
          <h3>NAMA ADMIN 1</h3>
          <span class="role">LEADER</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="contact">
        <div class="field-label">KONTAK</div>
        <a href="#">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          admin1@patolasquad.com
        </a>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="scale-strip"></div>
      <div class="card-top">
        <div class="photo-wrap">
          <img class="photo" src="image/admin2.jpg" alt="Admin 2" />
          <span class="num-chip">02</span>
        </div>
        <div class="who">
          <h3>NAMA ADMIN 2</h3>
          <span class="role">CO-LEADER</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="contact">
        <div class="field-label">KONTAK</div>
        <a href="#">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          admin2@patolasquad.com
        </a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>&copy; 2026 PATOLA SQUAD. All rights reserved.</div>
</footer>

<script src="patola.js"></script>
</body>
</html>
